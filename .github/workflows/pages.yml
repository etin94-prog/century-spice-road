name: Deploy game to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check rules and replay 2–4 player games
        run: node qa/rules.cjs
      - name: Replay Eastern Wonders and A New World
        run: node qa/expeditions.cjs
      - name: Replay all three combined games
        run: node qa/combinations.cjs
      - name: Verify Splendor decks, payments and replay
        run: node qa/splendor.cjs
      - name: Replay four Splendor expansions with 2–4 seats
        run: node qa/splendor-expansions.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install mobile browser and Firebase emulator tools
        run: |
          npm install --prefix "$RUNNER_TEMP/qa" playwright@1.55.0 firebase-tools@14.15.2
          "$RUNNER_TEMP/qa/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/qa/node_modules" >> "$GITHUB_ENV"
      - name: Check mobile touch and previous release rooms before publishing
        run: |
          node qa/serve.cjs &
          node qa/review-mobile.cjs
          node qa/guild-mobile.cjs
          node qa/combination-mobile.cjs
          "$RUNNER_TEMP/qa/node_modules/.bin/firebase" emulators:exec --only auth,database --project demo-century 'node qa/rejoin-release.cjs && node qa/guild-mobile.cjs --rooms'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
