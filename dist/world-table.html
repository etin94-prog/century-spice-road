<!doctype html>
<html lang="ko" data-table="world">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#163b37" />
    <title>세계 게임 테이블</title>
    <link rel="stylesheet" href="card-material.css?v=1" />
    <link rel="stylesheet" href="ww-table.css?v=2" />
    <link rel="stylesheet" href="card-display.css" />
    <script defer src="card-display.js"></script>
    <script type="module" src="ww-table.js"></script>
  <link rel="stylesheet" href="ww-materials.css?v=2" /><link rel="stylesheet" href="ww-tabletop.css?v=2" /><link rel="stylesheet" href="ww-fit-core.css?v=2" /><link rel="stylesheet" href="ww-fit-boards.css?v=1" /><link rel="stylesheet" href="ww-fit-paths.css?v=1" /><link rel="stylesheet" href="ww-fit-chess.css?v=1" /><link rel="stylesheet" href="ww-fit-cards.css?v=1" /><link rel="stylesheet" href="ww-fit-precision.css?v=1" /><link rel="stylesheet" href="ww-fit-arcade.css?v=1" /><link rel="stylesheet" href="ww-fit-puzzles.css?v=1" /><script defer src="board-press.js"></script><script defer src="card-tilt.js?v=1"></script></head>
  <body>
    <main>
      <header>
        <a href="./#worldwide" aria-label="세계 게임 목록으로">‹ 목록</a>
        <h1 id="name">세계 게임</h1>
        <div class="tools">
          <button id="guide" aria-label="규칙 보기">규칙</button
          ><button id="restart" aria-label="새 판 시작">새 판</button>
        </div>
      </header>
      <div class="tools dock" role="toolbar" aria-label="화면 도구">
        <button id="boardZoom" aria-pressed="false" aria-label="판 확대" hidden>확대</button
        ><button id="cardFull" aria-pressed="false" aria-label="전체화면">전체화면</button
        ><button id="cardWide" aria-pressed="false" aria-label="가로로 돌려 보기">가로</button
        ><button id="cardAudioSettings" aria-haspopup="dialog" aria-label="소리 설정">소리</button>
      </div>
      <div class="desk">
        <div class="rail">
          <p id="status" aria-live="polite"></p>
          <p id="score"></p>
        </div>
        <div id="surface"></div>
        <p id="result" role="status" hidden></p>
      </div>
      <dialog id="dialog">
        <h2></h2>
        <p></p>
        <a href="ww-licenses.txt" class="credits">제작 자료 출처</a>
        <form method="dialog">
          <button value="close">닫기</button
          ><button id="confirm" value="restart" hidden>새 판 시작</button>
        </form>
      </dialog>
      <dialog id="cardAudioDialog" aria-labelledby="cardAudioTitle">
        <h2 id="cardAudioTitle">소리 설정</h2>
        <label for="card-music"
          ><span>배경음악</span><output id="card-music-value" for="card-music"></output
          ><input name="music" id="card-music" type="range" min="0" max="100" /></label
        ><label for="card-effects"
          ><span>효과음</span><output id="card-effects-value" for="card-effects"></output
          ><input name="effects" id="card-effects" type="range" min="0" max="100" /></label
        ><label for="card-voice"
          ><span>결과 음성</span><output id="card-voice-value" for="card-voice"></output
          ><input name="voice" id="card-voice" type="range" min="0" max="100"
        /></label>
        <div class="card-audio-actions">
          <button type="button" data-audio-preview>결과음 듣기</button>
          <form method="dialog"><button>닫기</button></form>
        </div>
      </dialog>
      <script src="worldwide-cards.js"></script>
      <script src="card-audio.js"></script>
    </main>
  </body>
</html>
